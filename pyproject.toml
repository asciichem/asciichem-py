[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asciichem"
version = "0.1.0"
description = "Python implementation of AsciiChem - parse ASCII chemistry into a semantic model; canonical text and wire JSON. Conformant with asciichem-model v1 and the asciichem-tests corpus."
readme = "README.md"
license = { text = "BSD-2-Clause" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "jsonschema>=4", "pyyaml>=6", "referencing>=0.35"]

[project.urls]
Homepage = "https://asciichem.org"
Repository = "https://github.com/asciichem/asciichem-py"

[tool.setuptools.packages.find]
where = ["src"]
